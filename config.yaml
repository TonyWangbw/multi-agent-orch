# 编排服务配置

# 数据库
db_path: ./data/orchestrator.db

# 摘要配置
summary_enabled: true
summary_model: glm-5.1
summary_max_tokens: 512
summary_api_key_env: SUMMARY_API_KEY
summary_api_base: https://open.bigmodel.cn/api/paas/v4

# 进程管理
max_cli_instances: 10
cli_binary: codebuddy

# 日志
log_level: info
log_file: ./logs/orch.log
